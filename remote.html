<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SL TV Remote</title>
  <link rel="stylesheet" href="assets/remote.css" />
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="radio">📻 Radio</button>
    <button class="tab" data-tab="tv">📺 TV</button>
    <button class="tab" data-tab="party">🎉 Party</button>
    <button class="tab" data-tab="favorites">⭐ Favs</button>
    <button class="tab" data-tab="settings" disabled>⚙️ Settings</button>
  </nav>

  <section id="panel-radio" class="panel active">
    <div class="search-row">
      <input id="radioSearch" type="text" placeholder="Search stations (name, genre)…" />
      <button id="radioSearchBtn">Search</button>
    </div>
    <div id="radioResults"><div class="hint">Search the Radio-Browser directory to begin.</div></div>
  </section>

  <section id="panel-tv" class="panel">
    <div id="tvCategories" class="chips"></div>
    <div id="tvResults"><div class="hint">Pick a category to load channels.</div></div>
  </section>

  <section id="panel-party" class="panel">
    <div class="party-row">
      <input id="cytubeInput" type="text" placeholder="CyTube channel name" />
      <button id="cytubeGo">Go</button>
      <button id="cytubeFav" class="fav" title="Favorite">☆</button>
    </div>
    <div class="party-row">
      <input id="roomInput" type="text" placeholder="Paste room/video URL (Kosmi, YouTube…)" />
      <button id="roomGo">Go</button>
      <button id="roomFav" class="fav" title="Favorite">☆</button>
    </div>
    <div class="hint">Synced by the service — everyone sees the same playback. Fullscreen syncs from the remote.</div>
  </section>

  <section id="panel-favorites" class="panel">
    <div id="favList"><div class="empty">No favorites yet — tap ⭐ on a station.</div></div>
  </section>

  <div id="debug"></div>

  <script type="module" src="assets/remote.js"></script>
</body>
</html>
