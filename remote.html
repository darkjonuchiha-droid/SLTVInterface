<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SL TV Remote</title>
  <link rel="stylesheet" href="assets/remote.css" />
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="radio">📻 Radio</button>
    <button class="tab" data-tab="tv">📺 TV</button>
    <button class="tab" data-tab="party">🎉 Party</button>
    <button class="tab" data-tab="favorites">⭐ Favs</button>
    <button class="tab" data-tab="settings">⚙️ Settings</button>
  </nav>

  <section id="panel-radio" class="panel active">
    <div class="search-row">
      <input id="radioSearch" type="text" placeholder="Search stations (name, genre)…" />
      <button id="radioSearchBtn">Search</button>
    </div>
    <div id="radioResults"><div class="hint">Search the Radio-Browser directory to begin.</div></div>
  </section>

  <section id="panel-tv" class="panel">
    <div id="tvCategories" class="chips"></div>
    <div id="tvResults"><div class="hint">Pick a category to load channels.</div></div>
  </section>

  <section id="panel-party" class="panel">
    <div class="party-row">
      <input id="cytubeInput" type="text" placeholder="CyTube channel name" />
      <button id="cytubeGo">Go</button>
      <button id="cytubeFav" class="fav" title="Favorite">☆</button>
    </div>
    <div class="party-row">
      <input id="roomInput" type="text" placeholder="Paste room/video URL (Kosmi, YouTube…)" />
      <button id="roomGo">Go</button>
      <button id="roomFav" class="fav" title="Favorite">☆</button>
    </div>
    <div class="hint">Synced by the service — everyone sees the same playback. Fullscreen syncs from the remote.</div>
  </section>

  <section id="panel-settings" class="panel">
    <div class="set-group">
      <div class="set-title">Power</div>
      <div class="btn-row">
        <button class="ctl" data-power="ON">⏻ On</button>
        <button class="ctl" data-power="OFF">⏾ Standby</button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-title">Display</div>
      <div class="btn-row">
        <button class="ctl" data-disp="FIT">Fit</button>
        <button class="ctl" data-disp="FILL">Fill</button>
        <button class="ctl" data-disp="STRETCH">Stretch</button>
        <button class="ctl" data-disp="CINEMA">Cinema</button>
      </div>
      <div class="btn-row">
        <button class="ctl" data-disp="FS_ON">⛶ Fullscreen (all)</button>
        <button class="ctl" data-disp="FS_OFF">Windowed</button>
      </div>
      <div class="set-title">Aspect</div>
      <div class="btn-row">
        <button class="ctl" data-disp="ASPECT_169">16:9</button>
        <button class="ctl" data-disp="ASPECT_43">4:3</button>
        <button class="ctl" data-disp="ASPECT_219">21:9</button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-title">Volume</div>
      <input id="volSlider" type="range" min="0" max="100" value="80" />
    </div>
    <div class="set-group">
      <div class="set-title">Content</div>
      <label class="toggle"><input type="checkbox" id="adultToggle" /> Enable adult category</label>
    </div>
    <div class="set-group">
      <div class="set-title">System</div>
      <div id="updateStatus" class="hint"></div>
      <div class="btn-row"><button class="ctl" id="checkUpdateBtn">Check for updates</button></div>
    </div>
  </section>

  <section id="panel-favorites" class="panel">
    <div id="favList"><div class="empty">No favorites yet — tap ⭐ on a station.</div></div>
  </section>

  <div id="debug"></div>

  <script type="module" src="assets/remote.js"></script>
</body>
</html>
