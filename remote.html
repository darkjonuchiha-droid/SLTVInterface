<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Remote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .status {
            font-size: 11px;
            color: #4CAF50;
            margin-top: 5px;
        }
        
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 10px;
            gap: 10px;
        }
        
        .power-section {
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        
        .power-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ff4444;
            background: radial-gradient(circle, #ff4444 0%, #cc0000 100%);
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .power-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 68, 68, 0.6);
        }
        
        .power-btn.on {
            border-color: #4CAF50;
            background: radial-gradient(circle, #4CAF50 0%, #2d7a2d 100%);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
        }
        
        .section-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0 5px 0;
            padding-left: 5px;
        }
        
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .channel-btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .channel-btn:active {
            transform: scale(0.95);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.1));
        }
        
        .channel-icon {
            font-size: 32px;
            margin-bottom: 5px;
        }
        
        .channel-name {
            font-size: 12px;
            font-weight: 600;
        }
        
        .control-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        
        .control-btn {
            flex: 1;
            max-width: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .control-label {
            font-size: 9px;
            margin-top: 3px;
            opacity: 0.7;
        }
        
        .quick-channels {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .quick-btn {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quick-btn:active {
            transform: scale(0.98);
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4));
        }
        
        .quick-number {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        
        .quick-name {
            font-size: 13px;
            font-weight: 500;
        }
        
        .url-input-section {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }
        
        .url-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .url-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .url-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .url-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        .aspect-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        
        .aspect-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 5px;
            color: white;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .aspect-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .notification {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.95);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        
        .notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>
    
    <div class="header">
        <h1>📺 TV REMOTE</h1>
        <div class="status" id="status">Ready</div>
    </div>
    
    <div class="main-container">
        <!-- Power Button -->
        <div class="power-section">
            <button class="power-btn" id="powerBtn" onclick="togglePower()">⏻</button>
        </div>
        
        <!-- Popular Channels -->
        <div class="section-title">Popular Channels</div>
        <div class="channel-grid">
            <button class="channel-btn" onclick="loadChannel('https://www.youtube.com', 'YouTube')">
                <div class="channel-icon">📺</div>
                <div class="channel-name">YouTube</div>
            </button>
            <button class="channel-btn" onclick="loadChannel('https://www.netflix.com/browse', 'Netflix')">
                <div class="channel-icon">🎬</div>
                <div class="channel-name">Netflix</div>
            </button>
            <button class="channel-btn" onclick="loadChannel('https://www.twitch.tv', 'Twitch')">
                <div class="channel-icon">🎮</div>
                <div class="channel-name">Twitch</div>
            </button>
            <button class="channel-btn" onclick="loadChannel('https://pluto.tv/live-tv', 'Pluto TV')">
                <div class="channel-icon">📡</div>
                <div class="channel-name">Pluto TV</div>
            </button>
        </div>
        
        <!-- Quick Channels -->
        <div class="section-title">Quick Access</div>
        <div class="quick-channels">
            <button class="quick-btn" onclick="loadChannel('https://www.youtube.com/gaming', 'Gaming')">
                <div class="quick-number">1</div>
                <div class="quick-name">YouTube Gaming</div>
            </button>
            <button class="quick-btn" onclick="loadChannel('https://www.youtube.com/watch?v=jfKfPfyJRdk', 'Lofi')">
                <div class="quick-number">2</div>
                <div class="quick-name">Lofi Radio 24/7</div>
            </button>
            <button class="quick-btn" onclick="loadChannel('https://darkjonuchiha-droid.github.io/SLTVInterface/', 'Home')">
                <div class="quick-number">3</div>
                <div class="quick-name">Media Hub</div>
            </button>
        </div>
        
        <!-- Controls -->
        <div class="section-title">Controls</div>
        <div class="control-row">
            <button class="control-btn" onclick="sendCommand('HOME')">
                <div>🏠</div>
                <div class="control-label">HOME</div>
            </button>
            <button class="control-btn" onclick="toggleZoom()">
                <div>🔍</div>
                <div class="control-label">ZOOM</div>
            </button>
        </div>
        
        <!-- Aspect Ratio -->
        <div class="section-title">Aspect Ratio</div>
        <div class="aspect-controls">
            <button class="aspect-btn" onclick="setAspect('4:3 SD')">4:3<br>SD</button>
            <button class="aspect-btn" onclick="setAspect('16:9 FHD')">16:9<br>HD</button>
            <button class="aspect-btn" onclick="setAspect('21:9 UW')">21:9<br>Ultra</button>
        </div>
        
        <!-- Custom URL -->
        <div class="section-title">Custom URL</div>
        <div class="url-input-section">
            <input type="text" class="url-input" id="customUrl" placeholder="Enter URL (https://...)">
            <button class="url-btn" onclick="loadCustomUrl()">🔗 Load URL</button>
        </div>
    </div>

    <script>
        let isPowerOn = true;
        let zoomEnabled = false;
        
        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 2000);
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        function sendToTV(command, data = '') {
            // This sends a message that SL can intercept via llDialog or chat
            const message = command + '|' + data;
            
            // Try to send via SL's chat interface
            if (window.location.href.includes('secondlife')) {
                // In SL, this will be picked up by the prim's script
                document.title = 'SLCMD:' + message;
            }
            
            // Store in memory for SL script to read
            const state = {cmd: command, data: data, ts: Date.now()};
            document.body.setAttribute('data-slcommand', JSON.stringify(state));
            
            console.log('Command sent:', command, data);
        }
        
        function togglePower() {
            isPowerOn = !isPowerOn;
            const btn = document.getElementById('powerBtn');
            
            if (isPowerOn) {
                btn.classList.add('on');
                sendToTV('POWER', 'ON');
                showNotification('⚡ TV Powered ON');
                updateStatus('Connected');
            } else {
                btn.classList.remove('on');
                sendToTV('POWER', 'OFF');
                showNotification('⚡ TV Powered OFF');
                updateStatus('Standby');
            }
        }
        
        function loadChannel(url, name) {
            sendToTV('LOAD_URL', url);
            showNotification('📺 Loading ' + name);
            updateStatus('Playing: ' + name);
        }
        
        function sendCommand(cmd) {
            sendToTV(cmd);
            showNotification('✓ Command sent');
        }
        
        function toggleZoom() {
            zoomEnabled = !zoomEnabled;
            sendToTV('ZOOM', zoomEnabled ? 'ON' : 'OFF');
            showNotification(zoomEnabled ? '🔍 Zoom ON' : '🔍 Zoom OFF');
        }
        
        function setAspect(ratio) {
            sendToTV('ASPECT', ratio);
            showNotification('📐 Aspect: ' + ratio);
        }
        
        function loadCustomUrl() {
            const url = document.getElementById('customUrl').value.trim();
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                sendToTV('LOAD_URL', url);
                showNotification('🔗 Loading custom URL');
                updateStatus('Custom URL');
                document.getElementById('customUrl').value = '';
            } else {
                showNotification('❌ Invalid URL');
            }
        }
        
        // Initialize
        document.getElementById('powerBtn').classList.add('on');
        updateStatus('Connected');
    </script>
</body>
</html>
