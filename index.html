<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Media Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        
        .panel h2 {
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }
        
        .video-section {
            grid-column: 1 / 2;
        }
        
        .controls-section {
            grid-column: 2 / 3;
        }
        
        #videoPlayer {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            background: #000;
        }
        
        .video-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
            min-width: 100px;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .btn-secondary {
            background: #2196F3;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
        }
        
        .input-group input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .audio-section {
            grid-column: 1 / 3;
        }
        
        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .station-card {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .station-card:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .station-card.active {
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4CAF50;
        }
        
        .station-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .station-genre {
            font-size: 0.9em;
            opacity: 0.8;
        }
        

        
        .status-bar {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        
        .volume-control {
            margin-top: 15px;
        }
        
        .volume-control input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .video-section, .controls-section, .audio-section {
                grid-column: 1 / 2;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 SL Media Dashboard</h1>
        
        <div class="dashboard">
            <!-- Video Section -->
            <div class="panel video-section">
                <h2>📺 Video Player</h2>
                <video id="videoPlayer" controls>
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-controls">
                    <button class="btn btn-primary" onclick="playVideo()">▶ Play</button>
                    <button class="btn btn-secondary" onclick="pauseVideo()">⏸ Pause</button>
                    <button class="btn btn-danger" onclick="stopVideo()">⏹ Stop</button>
                </div>
            </div>
            
            <!-- Controls Section -->
            <div class="panel controls-section">
                <h2>⚙️ Controls</h2>
                <div class="input-group">
                    <label>Video URL:</label>
                    <input type="text" id="videoUrl" placeholder="Enter video URL...">
                    <button class="btn btn-primary" onclick="loadVideo()" style="margin-top: 10px; width: 100%;">Load Video</button>
                </div>
                
                <div class="volume-control">
                    <label>🔊 Volume:</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" onchange="changeVolume()">
                </div>
                
                <div class="status-bar">
                    <strong>Status:</strong> <span id="status">Ready</span>
                </div>
            </div>
            
            <!-- Audio/Radio Section -->
            <div class="panel audio-section">
                <h2>🎵 Radio Stations</h2>
                <audio id="audioPlayer"></audio>
                <div class="station-grid">
                    <div class="station-card" onclick="playStation('https://stream.example.com/jazz', 'Jazz FM', this)">
                        <div class="station-name">🎷 Jazz FM</div>
                        <div class="station-genre">Smooth Jazz</div>
                    </div>
                    <div class="station-card" onclick="playStation('https://stream.example.com/rock', 'Rock Radio', this)">
                        <div class="station-name">🎸 Rock Radio</div>
                        <div class="station-genre">Classic Rock</div>
                    </div>
                    <div class="station-card" onclick="playStation('https://stream.example.com/electronic', 'Electronic Beats', this)">
                        <div class="station-name">🎧 Electronic</div>
                        <div class="station-genre">EDM & House</div>
                    </div>
                    <div class="station-card" onclick="playStation('https://stream.example.com/classical', 'Classical', this)">
                        <div class="station-name">🎻 Classical</div>
                        <div class="station-genre">Orchestra</div>
                    </div>
                </div>
            </div>
            

        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const audio = document.getElementById('audioPlayer');
        const status = document.getElementById('status');
        let currentStation = null;

        function updateStatus(msg) {
            status.textContent = msg;
        }

        function loadVideo() {
            const url = document.getElementById('videoUrl').value;
            if (url) {
                video.src = url;
                video.load();
                updateStatus('Video loaded');
            } else {
                updateStatus('Please enter a video URL');
            }
        }

        function playVideo() {
            if (video.src) {
                video.play();
                updateStatus('Playing video');
            } else {
                updateStatus('No video loaded');
            }
        }

        function pauseVideo() {
            video.pause();
            updateStatus('Video paused');
        }

        function stopVideo() {
            video.pause();
            video.currentTime = 0;
            updateStatus('Video stopped');
        }

        function changeVolume() {
            const volume = document.getElementById('volumeSlider').value / 100;
            video.volume = volume;
            audio.volume = volume;
            updateStatus(`Volume: ${Math.round(volume * 100)}%`);
        }

        function playStation(url, name, element) {
            // Remove active class from all stations
            document.querySelectorAll('.station-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Add active class to selected station
            element.classList.add('active');
            
            // Play the station
            audio.src = url;
            audio.play().catch(e => {
                updateStatus('Note: Replace URLs with real stream URLs');
            });
            updateStatus(`Playing: ${name}`);
            currentStation = name;
        }



        // Set initial volume
        changeVolume();
    </script>
</body>
</html>
